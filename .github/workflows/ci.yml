name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 利用者は Mac と Windows にもいる。プロセスの扱いが OS で違うので、それぞれで回す
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show dependency tree
        # コアは依存ゼロ。依存が増えていないかをここで目視できるようにする。
        run: uv tree --all-groups
      - name: Test
        run: uv run pytest -q
